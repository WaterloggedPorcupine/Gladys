[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# The database URL is not set here: migrations/env.py reads it from gladys.config.Settings
# (GLADYS_DATABASE__URL), so migrations and the app always target the same database.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
